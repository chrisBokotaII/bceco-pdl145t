<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (function () {
        try {
          var key = 'bceco_pdl145t_theme_v1';
          /* Default Light — outdoor field entry; System only when explicitly chosen */
          var pref = localStorage.getItem(key) || 'light';
          var dark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0B1120' : '#0F2544');
        } catch (e) {}
      })();
    </script>
    <title>Assistant de Fiche Terrain — BCECO / PDL-145T</title>
    <meta
      name="description"
      content="Plateforme opérationnelle de collecte terrain hors ligne, de suivi-évaluation des ouvrages et de reporting consolidé pour le programme BCECO / PDL-145T en République Démocratique du Congo."
    />
    <meta property="og:title" content="Assistant de Fiche Terrain — BCECO / PDL-145T" />
    <meta
      property="og:description"
      content="Suivi-évaluation terrain des ouvrages du PDL-145T (BCECO) : collecte hors ligne, validation coordonnateur et rapports Excel, CSV et PDF."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0F2544" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fiche PDL145" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <body class="bg-app-page text-app-primary antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
